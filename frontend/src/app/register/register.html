<div class="auth-card">
  <h1>Create account</h1>
  <p class="subtitle">Join Family Vault</p>

  <form (ngSubmit)="submit()">
    <label>
      Display name
      <input [(ngModel)]="displayName" name="displayName" required />
    </label>
    <label>
      Email
      <input type="email" [(ngModel)]="email" name="email" required />
    </label>
    <label>
      Password <small>(min 8 characters)</small>
      <input type="password" [(ngModel)]="password" name="password" required minlength="8" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="switch">
    Have an account? <a routerLink="/login">Sign in</a>
  </p>
</div>
